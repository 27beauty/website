#:schema node_modules/wrangler/config-schema.json
name = "27beauty"
main = "src/index.tsx"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Static files (CSS, favicon, robots.txt). Anything that does not match a file
# here falls through to the Worker in src/index.ts.
[assets]
directory = "./public"
binding = "ASSETS"

# Product catalogue, orders, coupons, settings.
[[d1_databases]]
binding = "DB"
database_name = "27beauty"
database_id = "9dbdff5f-56c6-4ec5-b705-c8f27fb0beb5"
migrations_dir = "migrations"

# Admin sessions, eBay OAuth tokens, short-lived caches.
[[kv_namespaces]]
binding = "KV"
id = "c2bbd1afeb964a1ea6c2fb36138936aa"

# Product images uploaded through the admin panel.
# Spending guardrail: Cloudflare has no hard cap on R2, so the shop enforces
# its own storage budget (see src/lib/media.ts and Admin → Settings → Image
# storage). Uploads that would cross it are refused, replaced photos are
# deleted, and /media/* is edge-cached so reads rarely reach R2 at all.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "27beauty-media"

# eBay sync runs every 10 minutes, so a listing created on either eBay account
# appears on the website within minutes rather than half an hour. That is 144
# runs a day — a rounding error against the free tier's 100,000 requests, and
# roughly 600 eBay Browse calls a day against a 5,000/day limit.
[triggers]
crons = ["*/10 * * * *"]

[vars]
SITE_NAME = "27beauty"
SITE_URL = "https://27beauty.co.uk"
SUPPORT_EMAIL = "hello@27beauty.co.uk"
CURRENCY = "GBP"
# Free delivery at or above this order value (pence). 0 disables the threshold.
FREE_SHIPPING_THRESHOLD_PENCE = "3000"
SHIPPING_FLAT_PENCE = "349"
